{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3>Edit Tutor Profile</h3>

    <form method="POST" action="{{ url_for('tutors_profile_r') }}">
        <div class="mb-3">
            <label>Subject</label>
            <input type="text" name="subject" class="form-control" value="{{ tutor[2] }}" required>
        </div>

        <div class="mb-3">
            <label>Qualification</label>
            <input type="text" name="qualification" class="form-control" value="{{ tutor[3] }}">
        </div>

        <div class="mb-3">
            <label>Experience Years</label>
            <input type="number" name="experience_years" class="form-control" value="{{ tutor[4] }}">
        </div>

        <div class="mb-3">
            <label>Hourly Rate</label>
            <input type="number" step="0.01" name="hourly_rate" class="form-control" value="{{ tutor[5] }}">
        </div>

        <div class="mb-3">
            <label>Bio</label>
            <textarea name="bio" class="form-control" rows="4">{{ tutor[6] }}</textarea>
        </div>

        <div class="mb-3">
            <label>Availability</label>
            <input type="text" name="availability" class="form-control" value="{{ tutor[7] }}">
        </div>

        <button type="submit" class="btn btn-primary">Save Profile</button>
        <a href="{{ url_for('tutor_dashboard') }}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
