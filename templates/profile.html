{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<style>
.container-fluid{
     background-color: powderblue;   
}
.body{
background-color: powderblue;
 }
</style>
<div class="container-fluid mt-4">

    <h2 class="text-center  mb-4">My Profile</h2>

    <table class="table table-bordered table-striped ">

        <tr>
            <th>User ID</th>
            <td>{{ user[0] }}</td>
        </tr>

        <tr>
            <th>First Name</th>
            <td>{{ user[1] }}</td>
        </tr>

        <tr>
            <th>Last Name</th>
            <td>{{ user[2] }}</td>
        </tr>

        <tr>
            <th>Email</th>
            <td>{{ user[3] }}</td>
        </tr>

        <tr>
            <th>Phone Number</th>
            <td>{{ user[4] }}</td>
        </tr>

        <tr>
            <th>Role</th>
            <td>{{ user[6] }}</td>
        </tr>

        <tr>
            <th>Account Created</th>
            <td>{{ user[7] }}</td>
        </tr>

    </table>

</div>

{% endblock %}
