{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<style>
    html, body {
        background-color: grey;
        background: grey;
    }
    .footer {
        background-color: grey;
        background: grey;
    }
  .container {
        background-color: grey;
        min-height: 85vh;
        padding: 30px 15px;
        width: 100vw;
        margin-left: calc(-50vw + 50%);
    }
  .profile-card {
        background-color: #FFE5B4;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #ffcc80;
    }
  .profile-card th {
        background-color: #FFCC99; 
        color: #000;
        width: 35%;
        padding: 12px 15px;
        font-weight: bold;
        border: 1px solid #e6a86b;
    }
  .profile-card td {
        background-color: #FFE5B4;
        padding: 12px 15px;
        border: 1px solid #e6a86b;
    }
  .profile-card ,th {
        background-color: #FFD699;
    }
</style>


    <div class="container">

        <h2 class="text-center mb-4" style="color:#000; font-weight:bold; margin-top: 60px; padding-top: 10px;" >My Profile</h2>

        <table class="table table-bordered profile-card">
            <tr>
                <th>User ID</th>
                <td>{{ user[0] }}</td>
            </tr>
            <tr>
                <th>First Name</th>
                <td>{{ user[1] }}</td>
            </tr>
            <tr>
                <th>Last Name</th>
                <td>{{ user[2] }}</td>
            </tr>
            <tr>
                <th>Email</th>
                <td>{{ user[3] }}</td>
            </tr>
            <tr>
                <th>Phone Number</th>
                <td>{{ user[4] }}</td>
            </tr>
            <tr>
                <th>Role</th>
                <td>{{ user[6] }}</td>
            </tr>
            <tr>
                <th>Account Created</th>
                <td>{{ user[7] }}</td>
            </tr>
        </table>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
    let footer = document.querySelector('footer');
    if(footer){
        footer.style.backgroundColor = "grey";
        footer.style.background = "grey";
    }
    document.body.style.backgroundColor = "grey";
});
</script>

{% endblock %}
