{% extends "base.html" %}
{% block content %}

<style>
 
  body{
    background: #808080;
    background-color: #808080;
    background-image: none;
  }
 .container {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
 .reviewcard {
    background: white;
    padding: 30px 35px;
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
 .reviewcard input[type="number"],
 .reviewcard select,
 .reviewcard textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
 .reviewcard input[type="submit"] {
    width: 100%;
    padding: 12px;
    background-color: #FF6B00;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
 
  
</style>

<div class="container">
  <div class="reviewcard">
    <h2 class="text-center mb-4" style="font-weight:700;">Leave a Review</h2>

    <form method="POST" action="/insert_reviews">
      <label>Booking ID:</label><br>
      <input type="number" name="booking_id" placeholder="Enter Booking ID " required>
      <br><br>

      <label>Tutor Name:</label><br>
      <input type="text" name="tutor_name" placeholder="Enter Tutor name" required
             value="{{ selected_tutor_id if selected_tutor_id }}">
      <br><br>

      <label>Rating (1-5):</label><br>
      <select name="rating" required>
        <option value=""> Select Rating </option>
        <option value="5">5 - Excellent</option>
        <option value="4">4 - Very Good</option>
        <option value="3">3 - Good</option>
        <option value="2">2 - Fair</option>
        <option value="1">1 - Poor</option>
      </select>
      <br><br>

      <label>Comment:</label><br>
      <textarea name="comment" rows="4" placeholder="Write your review here e.g. good tutor, very helpful" required></textarea>
      <br><br>

      <input type="submit" value="Submit Review" >
    </form>

    <p class="mt-4"><small>Your bookings:
    {% for b in bookings %}
      ID {{ b[0] }} (Tutor {{ b[1] }}) |
    {% endfor %}
    </small></p>
  </div>
</div>

{% endblock %}
